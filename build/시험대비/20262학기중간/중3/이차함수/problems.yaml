# 시험대비 · 2026학년도 2학기 중간고사 · 중3 · 이차함수 — problems.md 스무 문제. 지문은 problems.md
# 문장 그대로다(평가원 문형으로 퇴고한 것). 표기만 조판했다(SKILL.md 표기 규칙): 문장 안의 도형은
# 낱말(선분 AB, 삼각형 ABC, 사각형 ABCD — 이름만 \mathrm. 2026. 9. 23. 선생님 결정), 등식·비 안은
# 기호(\overline{\mathrm{AB}}=1, \overline{\mathrm{AC}}:\overline{\mathrm{CB}}=1:4), 점 이름 정체,
# 변수 이탤릭, 좌표 (a,\,b), 분수 \dfrac. 조건 상자는 conditions(+ after), 보기 상자는 notes.
# 머리줄·파일 이름·PDF 날짜는 build.py가 폴더 이름에서 만든다.
# 정답은 답만 적는 정답표다(선생님 방침). 풀이는 선생님이 직접 쓴 것만 넣는다. 001(2026. 9. 26.).
# 풀이의 줄 나눔도 선생님이 정했다. 조건 표지 (가)에서, (나)에서와 ①, ②에 의하여는 저마다 한 줄, 내용은 다음 줄부터.
# 글자는 안 바꾸고 단 글 너비(229pt, build.py의 width_of로 잰다)를 넘는 줄만 어절에서 갈랐다("즉," 앞).

problems:
  - text: 이차함수 $f(x)$가 다음 조건을 만족시킨다.
    conditions:
      - $f(0)=1$
      - 모든 실수 $x$에 대하여 $f(x+1)-f(x-1)=4x+2$이다.
    after: $f(4)$의 값을 구하시오.
    answer: $21$
    solution: |
      이차함수 $f(x)$를
      $ax^2+bx+c\ (a\neq 0)$라 하자.
      주어진 조건의
      (가)에서
      $f(0)=1$이므로 $c=1$ …… ①이고
      (나)에서
      모든 실수 $x$에 대하여
      $f(x+1)-f(x-1)=4x+2$이므로
      $4ax+2b=4x+2$
      즉, $a=1$, $b=1$ …… ②이다.
      ①, ②에 의하여
      $f(x)=x^2+x+1$이고 $f(4)=21$이다.
      따라서 $f(4)$의 값은 21이다.

  - text: 그림과 같이 직선 $l$은 이차함수 $y=\dfrac{1}{4}x^2$의 그래프와 두 점 $\mathrm{A}$, $\mathrm{B}$에서 만나고 $y$축과 점 $\mathrm{C}$에서 만난다. 점 $\mathrm{C}$의 $y$좌표가 1이고 $\overline{\mathrm{AC}}:\overline{\mathrm{CB}}=1:4$일 때, 직선 $l$의 기울기는? (단, $\mathrm{O}$는 원점이다.)
    figure: p2.svg
    alt: 포물선 y=1/4x²와 직선 l. l이 포물선과 A(왼쪽 아래), B(오른쪽 위)에서, y축과 C에서 만난다
    choices:
      - $\dfrac{3}{2}$
      - $\dfrac{4}{3}$
      - $\dfrac{4}{5}$
      - $\dfrac{3}{4}$
      - $\dfrac{2}{3}$
    answer: ④

  - text: 그림과 같이 제1사분면에 각 변이 $x$축 또는 $y$축에 평행한 정사각형 $\mathrm{ABCD}$가 있다. 두 점 $\mathrm{A}$, $\mathrm{C}$는 각각 이차함수 $y=x^2$, $y=\dfrac{1}{2}x^2$의 그래프 위에 있고, 점 $\mathrm{A}$의 $y$좌표가 점 $\mathrm{C}$의 $y$좌표보다 크다. $\overline{\mathrm{AB}}=1$일 때, 점 $\mathrm{A}$의 $x$좌표와 $y$좌표의 합은? (단, $\mathrm{O}$는 원점이다.)
    figure: p3.svg
    alt: 포물선 y=x²(안쪽)과 y=1/2x²(바깥). 제1사분면에 정사각형 ABCD. A 왼쪽 위(y=x² 위), C 오른쪽 아래(y=1/2x² 위)
    choices:
      - $9$
      - $10$
      - $11$
      - $12$
      - $13$
    answer: ④

  - text: 그림과 같이 이차함수 $y=\dfrac{1}{3}x^2$의 그래프 위의 두 점 $\mathrm{A}$, $\mathrm{C}$와 이차함수 $y=3x^2$의 그래프 위의 점 $\mathrm{D}$를 세 꼭짓점으로 하고 각 변이 $x$축 또는 $y$축에 평행한 직사각형 $\mathrm{ABCD}$가 있다. $\overline{\mathrm{AB}}:\overline{\mathrm{BC}}=1:2$일 때, 직사각형 $\mathrm{ABCD}$의 넓이를 구하시오. (단, 점 $\mathrm{A}$의 $x$좌표는 양수이고, $\mathrm{O}$는 원점이다.)
    figure: p4.svg
    alt: 포물선 y=3x²(가파름)과 y=1/3x². 제1사분면에 세로로 긴 직사각형 ABCD 색칠. A 왼쪽 아래(y=1/3x²), B 오른쪽 아래, C 오른쪽 위(y=1/3x²), D 왼쪽 위(y=3x²)
    answer: $18$

  - text: 자연수 $n$에 대하여 그림과 같이 좌표평면 위의 네 점 $(n,\,n)$, $(2n,\,n)$, $(2n,\,2n)$, $(n,\,2n)$을 꼭짓점으로 하는 정사각형을 $\mathrm{A}_n$이라 하자. 정사각형 $\mathrm{A}_n$과 이차함수 $y=\dfrac{1}{k}x^2$의 그래프가 만나도록 하는 자연수 $k$의 개수를 $f(n)$이라 할 때, $f(1)+f(3)+f(5)$의 값을 구하시오. (단, $\mathrm{O}$는 원점이다.)
    figure: p5.svg
    alt: 포물선 y=1/kx²와 제1사분면의 정사각형. 꼭짓점 (n, n), (2n, 2n)에서 축으로 점선, 축에 n과 2n. 포물선이 정사각형의 아래 변에서 들어와 위 변으로 나간다
    answer: $33$

  - text: 그림과 같이 이차함수 $y=4x^2$의 그래프 위의 두 점 $\mathrm{A}$, $\mathrm{D}$와 이차함수 $y=ax^2$의 그래프 위의 점 $\mathrm{B}$, $y$축 위의 점 $\mathrm{C}$를 꼭짓점으로 하고 선분 $\mathrm{AD}$가 $x$축에 평행한 평행사변형 $\mathrm{ABCD}$가 있다. 두 점 $\mathrm{A}$, $\mathrm{B}$의 $y$좌표의 절댓값이 서로 같을 때, 상수 $a$의 값을 구하시오. (단, $\mathrm{O}$는 원점이다.)
    figure: p6.svg
    alt: 위로 열린 y=4x²와 아래로 열린 y=ax². 평행사변형 ABCD. A 왼쪽 위, D 오른쪽 위(y=4x² 위), B 왼쪽 아래(y=ax² 위), C y축 위 아래쪽
    answer: $-1$

  - text: 그림과 같이 두 이차함수 $y=ax^2-b$, $y=-ax^2+b$의 그래프가 좌표축과 만나는 네 점을 $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$, $\mathrm{D}$라 하자. 사각형 $\mathrm{ABCD}$가 정사각형일 때, 두 양수 $a$, $b$에 대하여 항상 성립하는 것은? (단, $\mathrm{O}$는 원점이다.)
    figure: p7.svg
    alt: 위로 열린 y=ax²−b(꼭짓점 C)와 아래로 열린 y=−ax²+b(꼭짓점 A)가 x축 위의 B(왼쪽), D(오른쪽)에서 만난다. 마름모꼴 ABCD
    choices:
      - $ab=1$
      - $a-b=0$
      - $a+b=1$
      - $a+b=2$
      - $a^2+b^2=2$
    answer: ①

  - text: 그림과 같이 이차함수 $y=x^2+1$의 그래프 위의 점 $\mathrm{P}$를 지나고 $x$축에 평행한 직선이 직선 $y=x-1$과 만나는 점을 $\mathrm{Q}$라 하자. $\overline{\mathrm{PQ}}=8$일 때, 점 $\mathrm{P}$의 $x$좌표를 모두 구하시오. (단, $\mathrm{O}$는 원점이다.)
    figure: p8.svg
    alt: 포물선 y=x²+1과 직선 y=x−1. 포물선 오른쪽 가지의 P에서 오른쪽으로 그은 수평 선분이 직선 위의 Q에 닿는다
    answer: $-2$, $3$

  - text: 그림과 같이 직선 $y=x+m$이 $x$축, $y$축과 만나는 점을 각각 $\mathrm{A}$, $\mathrm{B}$라 하고, 이차함수 $y=(x-3)^2$의 그래프와 직선 $y=x+m$이 만나는 두 점 중 $x$좌표가 큰 점을 $\mathrm{C}$라 하자. $\overline{\mathrm{AC}}=3\overline{\mathrm{AB}}$일 때, 상수 $m$의 값을 구하시오. (단, $m>0$이고, $\mathrm{O}$는 원점이다.)
    figure: p9.svg
    alt: 직선 y=x+m이 x축과 A, y축과 B에서 만나고 포물선 y=(x−3)²과 오른쪽 위 C에서 만난다
    answer: $3$

  - text: 이차함수 $y=-(x-1)^2+6$의 그래프 위의 점 $\mathrm{P}$는 제1사분면 위에 있다. 점 $\mathrm{P}$와 이 그래프의 축 사이의 거리가 점 $\mathrm{P}$와 $x$축 사이의 거리와 같을 때, 점 $\mathrm{P}$의 $x$좌표는?
    choices:
      - $2$
      - $3$
      - $4$
      - $5$
      - $6$
    answer: ②

  - text: 이차함수 $y=-\dfrac{1}{2}(x-3)^2+1$의 그래프와 $x$축에 대하여 대칭인 그래프를 $y$축의 방향으로 $q$만큼 평행이동한 그래프가 $x$축과 만나는 두 점 사이의 거리가 $4\sqrt{2}$일 때, 상수 $q$의 값을 구하시오.
    answer: $-3$

  - text: 이차함수 $y=x^2-ax+a$의 그래프에 대하여 옳은 것만을 보기에서 있는 대로 고른 것은? (단, $a$는 실수이다.)
    notes:
      - 점 $(1,\,1)$을 지난다.
      - $x$축의 방향으로 $-\dfrac{a}{2}$만큼 평행이동한 그래프는 $y$축에 대하여 대칭이다.
      - 꼭짓점이 $x$축 위에 있도록 하는 $a$의 개수는 1이다.
    choices:
      - ㄱ
      - ㄷ
      - ㄱ, ㄴ
      - ㄴ, ㄷ
      - ㄱ, ㄴ, ㄷ
    answer: ③

  - text: 그림과 같이 두 이차함수 $y=x^2+2$, $y=-x^2+2x+6$의 그래프는 두 점 $\mathrm{A}(-1,\,3)$, $\mathrm{B}(2,\,6)$에서 만난다. 두 이차함수의 그래프로 둘러싸인 부분의 넓이를 $S$, 이차함수 $y=x^2+2$의 그래프와 $x$축 및 두 직선 $x=-1$, $x=2$로 둘러싸인 부분의 넓이를 $T$라 할 때, $S+2T$의 값을 구하시오. (단, $\mathrm{O}$는 원점이다.)
    figure: p13.svg
    alt: 위로 열린 y=x²+2와 아래로 열린 y=−x²+2x+6이 A, B에서 만난다. 두 포물선 사이 S(10%)와 y=x²+2 아래 x=−1~2 구간 T(22%)가 색칠. A, B에서 y축으로 점선, y축에 3·6, x축에 −1·2
    answer: $27$

  - text: 이차함수 $y=-\dfrac{1}{2}x^2+x-\dfrac{11}{2}$의 그래프의 꼭짓점을 $\mathrm{A}$라 하고, 이 그래프를 $x$축의 방향으로 $p$만큼, $y$축의 방향으로 $q$만큼 평행이동한 그래프의 꼭짓점을 $\mathrm{B}$라 하자. 직선 $\mathrm{AB}$가 직선 $y=-2x+5$와 평행할 때, $2p+q$의 값을 구하시오. (단, $p\neq 0$)
    answer: $0$

  - text: 이차함수 $y=-3x^2+3$의 그래프를 $y$축의 방향으로 $q$만큼 평행이동한 그래프가 $x$축과 만나는 두 점 사이의 거리가 이차함수 $y=-3x^2+3$의 그래프가 $x$축과 만나는 두 점 사이의 거리의 2배일 때, 상수 $q$의 값은?
    choices:
      - $-3$
      - $3$
      - $6$
      - $9$
      - $12$
    answer: ④

  - text: 그림과 같이 이차함수 $y=\dfrac{1}{2}x^2+x-4$의 그래프가 $x$축과 만나는 두 점을 $\mathrm{A}$, $\mathrm{C}$라 하고, $y$축과 만나는 점을 $\mathrm{B}$라 하자. 사각형 $\mathrm{ABCD}$가 평행사변형일 때, 점 $\mathrm{D}$의 좌표를 구하시오. (단, 점 $\mathrm{A}$의 $x$좌표는 점 $\mathrm{C}$의 $x$좌표보다 작고, $\mathrm{O}$는 원점이다.)
    figure: p16.svg
    alt: 위로 열린 y=1/2x²+x−4. x축과 A(왼쪽), C(오른쪽), y축과 B(아래)에서 만난다. D는 왼쪽 위. 평행사변형 ABCD 색칠
    answer: $(-2,\,4)$

  - text: 그림과 같이 이차함수 $y=-x^2-4x+5$의 그래프의 꼭짓점을 $\mathrm{A}$, 이 그래프가 $x$축과 만나는 두 점을 $\mathrm{B}$, $\mathrm{C}$라 하고, 점 $\mathrm{B}$를 지나는 직선 $l$이 선분 $\mathrm{AC}$와 만나는 점을 $\mathrm{D}$라 하자. 직선 $l$이 삼각형 $\mathrm{ABC}$의 넓이를 이등분할 때, 점 $\mathrm{D}$의 좌표를 구하시오. (단, 점 $\mathrm{B}$의 $x$좌표는 점 $\mathrm{C}$의 $x$좌표보다 작고, $\mathrm{O}$는 원점이다.)
    figure: p17.svg
    alt: 아래로 열린 y=−x²−4x+5. 꼭짓점 A가 y축 왼쪽 위, x축과 B(왼쪽), C(오른쪽)에서 만난다. 삼각형 ABC 색칠. B에서 오른쪽 위로 가는 직선 l이 선분 AC와 D에서 만난다
    answer: $\left(-\dfrac{1}{2},\,\dfrac{9}{2}\right)$

  - text: 그림과 같이 이차함수 $y=-x^2+bx+c$의 그래프는 $x$축과 두 점 $\mathrm{A}$, $\mathrm{B}$에서 만나고, $y$축과 점 $\mathrm{C}$에서 만난다. 두 점 $\mathrm{B}$, $\mathrm{C}$가 직선 $y=-2x+8$ 위에 있을 때, $c-b$의 값을 구하시오. (단, $b$, $c$는 상수이고, $\mathrm{O}$는 원점이다.)
    figure: p18.svg
    alt: 아래로 열린 y=−x²+bx+c. x축과 A(왼쪽), B(오른쪽), y축과 C에서 만난다. 오른쪽 아래로 내려가는 직선 y=−2x+8이 포물선과 C, B에서 만난다
    answer: $6$

  - text: 그림과 같이 최고차항의 계수가 1인 세 이차함수 $y=f(x)$, $y=g(x)$, $y=h(x)$의 그래프는 모두 점 $(1,\,0)$을 지나고, $x$축과 만나는 다른 한 점의 $x$좌표가 각각 2, 3, 4이다. 함수 $y=f(x)+g(x)+h(x)$의 그래프의 꼭짓점의 좌표를 구하시오. (단, $\mathrm{O}$는 원점이다.)
    figure: p19.svg
    alt: 위로 열린 포물선 셋이 (1, 0)을 지난다. x축의 다른 교점은 2(f), 3(g), 4(h). x축에 1·2·3·4, 곡선마다 y=f(x), y=g(x), y=h(x)
    answer: $(2,\,{-3})$

  - text: 그림과 같이 두 이차함수 $f(x)=x^2$, $g(x)=ax^2+bx+c$의 그래프는 원점 $\mathrm{O}$와 점 $\mathrm{A}$에서 만나고, 점 $\mathrm{A}$는 이차함수 $y=g(x)$의 그래프의 꼭짓점이다. 직선 $y=k$가 두 이차함수의 그래프와 만나는 점의 $x$좌표를 작은 것부터 차례로 $x_1$, $x_2$, …, $x_n$이라 하자. $x_3-x_1=2$, $x_4-x_2=2\sqrt{3}$일 때, $a+b+c$의 값을 구하시오. (단, 점 $\mathrm{A}$는 제1사분면 위에 있고, $a$, $b$, $c$, $k$는 상수이다.)
    figure: p20.svg
    alt: 위로 열린 y=f(x)와 아래로 열린 y=g(x)가 원점 O와 제1사분면의 A(g의 꼭짓점)에서 만난다. 직선 y=k와 교점은 글에만 있고 그림에는 없다(선생님 지시)
    answer: $3$
