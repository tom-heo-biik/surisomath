# 이차함수 020의 확정 정본을 글자 그대로 옮겼다(2026. 9. 26. 봉인). 원본은 그 단원의 problems.yaml이다.
# 이 폴더에는 봉인이 없어 빌드가 대조하지 않는다. 글은 고치지 않고 원본이 바뀌면 다시 옮긴다.
text: 그림과 같이 두 이차함수 $f(x)=x^2$, $g(x)=ax^2+bx+c$의 그래프는 원점 $\mathrm{O}$와 점 $\mathrm{A}$에서 만나고, 점 $\mathrm{A}$는 이차함수 $y=g(x)$의 그래프의 꼭짓점이다. 직선 $y=k$가 두 이차함수의 그래프와 만나는 점의 $x$좌표를 작은 것부터 차례로 $x_1$, $x_2$, …, $x_n$이라 하자. $x_3-x_1=2$, $x_4-x_2=2\sqrt{3}$일 때, $a+b+c$의 값을 구하시오. (단, 점 $\mathrm{A}$는 제1사분면 위에 있고, $a$, $b$, $c$, $k$는 상수이다.)
figure: p002.svg
alt: 위로 열린 y=f(x)와 아래로 열린 y=g(x)가 원점 O와 제1사분면의 A(g의 꼭짓점)에서 만난다. 직선 y=k와 교점은 글에만 있고 그림에는 없다(선생님 지시)
answer: $3$
