# 이차함수 001의 확정 정본을 글자 그대로 옮겼다(2026. 9. 26. 봉인, 풀이까지). 원본은 그 단원의 problems.yaml이다.
# 이 폴더에는 봉인이 없어 빌드가 대조하지 않는다. 글은 고치지 않고 원본이 바뀌면 다시 옮긴다.
text: 이차함수 $f(x)$가 다음 조건을 만족시킨다.
conditions:
  - $f(0)=1$
  - 모든 실수 $x$에 대하여 $f(x+1)-f(x-1)=4x+2$이다.
after: $f(4)$의 값을 구하시오.
answer: $21$
solution: |
  이차함수 $f(x)$를
  $ax^2+bx+c\ (a\neq 0)$라 하자.
  주어진 조건의
  (가)에서
  $f(0)=1$이므로 $c=1$ …… ①이고
  (나)에서
  모든 실수 $x$에 대하여
  $f(x+1)-f(x-1)=4x+2$이므로
  $4ax+2b=4x+2$
  즉, $a=1$, $b=1$ …… ②이다.
  ①, ②에 의하여
  $f(x)=x^2+x+1$이고 $f(4)=21$이다.
  따라서 $f(4)$의 값은 21이다.
