# 수행평가 · 2026학년도 2학기 · 수지중학교 · 중1 · 2026. 9. 17. — 옆의 2026.09.17.md 세 문제.
#   지문은 md 문장 그대로다. 수식 표기만 조판했다: != → \neq, b/x → \dfrac{b}{x}, 점 P → \mathrm{P}.
#   머리줄·파일 이름·PDF 날짜는 build.py가 폴더 이름(20262학기/수지중학교/중1/2026.09.17)에서 만든다.
#   학생 쪽(1~3쪽) 뒤에 선생님 쪽(4~6쪽)이 같은 차례로 붙는다. 정답은 선생님 쪽 머리줄 오른쪽 끝에,
#   solution은 빈 자리 위부터 한 줄 = 한 칸. 식 번호는 연마대로 "…… ①이고"처럼 수식 뒤에 글로 쓴다.
#   좌표의 둘째 성분이 음수면 $(8,\,{-2})$처럼 중괄호로 감싼다 — 안 감싸면 mathtext가 쉼표 뒤
#   마이너스를 이항 연산자로 보아 좌우 2pt씩 벌린다.
#
#   003 표의 빈 칸: md는 완성된 표(정답)를 적었고 어느 칸을 비울지는 적지 않았다. 교과서
#   '표를 완성하시오' 관례대로 첫 계급은 도수·상대도수를 다 주고, 나머지는 도수와 상대도수를
#   번갈아 비웠다. {답: 값}이 빈 칸이다 — 학생 쪽은 빈 칸, 선생님 쪽은 회색 값. 다르게 비우려면
#   {답: 값}의 자리를 옮기면 된다.
#   md의 40~60 상대도수 0.39는 18/50 = 0.36의 오기로 보인다(0.39면 학생 수가 19.5명). 답 칸에는
#   0.36을 적었다.

problems:
  - text: 다음 그림과 같이 정비례 그래프 $y=ax\ (a\neq 0)$와 반비례 그래프 $y=\dfrac{b}{x}\ (b\neq 0)$가 점 $\mathrm{P}$에서 만날 때, 두 수 $a$, $b$의 값이 각각 몇인지 서술하여라.
    figure: p1.svg
    alt: 좌표평면에 원점을 지나며 오른쪽 아래로 내려가는 직선 y=ax와 제2·4사분면의 쌍곡선 y=b/x. 제2사분면의 교점 P에서 두 축에 점선을 내려 x좌표 −4, y좌표 1을 적었다. 직선 위 제4사분면의 점 (8, −2)도 점으로 표시하고 두 축에 점선을 내려 8, −2를 적었다
    answer: $a=-\dfrac{1}{4}$, $b=-4$
    solution: |
      점 $\mathrm{P}$의 $x$좌표를 $p$라 하자.
      주어진 그림에서 정비례 그래프 $y=ax\ (a\neq 0)$는 점 $\mathrm{P}$와 점 $(8,\,{-2})$를 지나고
      점 $\mathrm{P}$의 좌표는 $(p,\,1)$이므로 $x=8$, $y=-2$를 대입하면
      $-2=8a$ 즉, $a=-\dfrac{1}{4}$ …… ①이고
      $x=p$, $y=1$을 대입하면
      ①에 의하여 $1=-\dfrac{1}{4}p$ 즉, $p=-4$이고 $\mathrm{P}$의 좌표는 $(-4,\,1)$ …… ②이다.
      문제에서 반비례 그래프 $y=\dfrac{b}{x}\ (b\neq 0)$는 점 $\mathrm{P}$를 지나므로
      ②에 의하여 $b=-4$ …… ③이다.
      따라서 두 수 $a$, $b$의 값은 각각 $a=-\dfrac{1}{4}$, $b=-4$이다.

