# 원문의 기호(△ABC, ∠A, 선분의 길이 AB̄, //, ⊥, ≡)와 배점 [4점]도 그대로 두었다. 그래서 verbatim: true로
# 평가원 표기 검사(munhang notation.py)를 건너뛴다. 조판은 연마 규칙이다. 점 이름 정체, 변수 이탤릭,
