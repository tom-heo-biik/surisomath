  - "no": "018"
    label: 논술형 1
    text: 두 직선의 방정식 $x+ay-10=0$, $x+y+b=0$의 그래프가 그림과 같을 때, $a+b$의 값을 구하고 그 과정을 서술하시오. (단, $a$, $b$는 수이다.) [7점]
    figure: p018.svg
    alt: 좌표평면. x+y+b=0(b=-4)은 y절편 4로 내려가고, x+ay-10=0(a=-2)은 올라간다. 두 직선은 (6, -2)에서 만나고 x축의 6에서 점선
    answer: $-6$
    solution: |
      주어진 그림에서
      직선 $x+y+b=0$의 $y$절편이 4이므로
      $b=-4$ …… ①이다.
      두 직선의 교점은 $x$좌표가 6이고
      직선 $x+y-4=0$ 위에 있으므로
      교점의 좌표는 $(6,\,{-2})$이다.
      이 점이 직선 $x+ay-10=0$ 위에 있으므로
      $a=-2$ …… ②이다.
      ①, ②에 의하여
      $a+b=-6$이다.
      따라서 $a+b$의 값은 $-6$이다.

  - "no": "019"
    label: 논술형 2
    text: $\angle\mathrm{C}=90^{\circ}$인 직각삼각형 $\mathrm{ABC}$에서 $\overline{\mathrm{AC}}=\overline{\mathrm{AD}}$가 되도록 $\overline{\mathrm{AB}}$ 위에 점 $\mathrm{D}$를 잡고, $\overline{\mathrm{AB}}\perp\overline{\mathrm{DE}}$이 되도록 $\overline{\mathrm{BC}}$ 위에 점 $\mathrm{E}$를 잡자. $\overline{\mathrm{BC}}=10$, $\overline{\mathrm{DE}}=3$일 때, $\overline{\mathrm{BE}}$의 길이를 구하고 그 과정을 서술하시오. [7점]
    figure: p019.svg
    alt: 직각삼각형 ABC(C 직각)와 변 AB 위의 점 D, 변 BC 위의 점 E, 선분 DE(D에서 직각). AD와 AC 같은 길이, DE 3, BC 10
    answer: $7$
    solution: |
      선분 $\mathrm{AE}$를 그으면
      두 직각삼각형 $\mathrm{ACE}$, $\mathrm{ADE}$에서
      $\angle\mathrm{ACE}=\angle\mathrm{ADE}=90^{\circ}$,
      $\overline{\mathrm{AC}}=\overline{\mathrm{AD}}$이고
      빗변 $\mathrm{AE}$는 공통이므로
      ${\bigtriangleup}\mathrm{ACE}\equiv{}{\bigtriangleup}\mathrm{ADE}$(RHS 합동)이다.
      즉, $\overline{\mathrm{CE}}=\overline{\mathrm{DE}}=3$이므로
      $\overline{\mathrm{BE}}=\overline{\mathrm{BC}}-\overline{\mathrm{CE}}=7$이다.
      따라서 $\overline{\mathrm{BE}}$의 길이는 7이다.

  - "no": "020"
    label: 논술형 3
    text: 평행사변형 $\mathrm{ABCD}$에서 $\overline{\mathrm{AB}}$, $\overline{\mathrm{CD}}$의 중점을 각각 $\mathrm{E}$, $\mathrm{F}$라고 할 때, 사각형 $\mathrm{EBFD}$가 평행사변형임을 설명하시오. [6점]
    figure: p020.svg
    alt: 평행사변형 ABCD와 변 AB의 중점 E, 변 CD의 중점 F. 사각형 EBFD 색칠
    answer: 풀이 참고
    solution: |
      평행사변형 $\mathrm{ABCD}$에서
      $\overline{\mathrm{AB}}//\overline{\mathrm{DC}}$, $\overline{\mathrm{AB}}=\overline{\mathrm{DC}}$이다.
      두 점 $\mathrm{E}$, $\mathrm{F}$는 각각
      $\overline{\mathrm{AB}}$, $\overline{\mathrm{CD}}$ 위에 있으므로
      $\overline{\mathrm{EB}}//\overline{\mathrm{DF}}$ …… ①이고
      $\mathrm{E}$, $\mathrm{F}$가 중점이므로
      $\overline{\mathrm{EB}}=\dfrac{1}{2}\overline{\mathrm{AB}}=\dfrac{1}{2}\overline{\mathrm{DC}}=\overline{\mathrm{DF}}$ …… ②이다.
      ①, ②에 의하여
      사각형 $\mathrm{EBFD}$는 한 쌍의 대변이
      평행하고 그 길이가 같다.
      따라서 사각형 $\mathrm{EBFD}$는 평행사변형이다.
