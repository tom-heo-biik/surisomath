series: 연마(硏磨)
unit: 원의 둘레와 넓이
file: 수리소_연마_원의둘레와넓이

problems:
  - text: 지름이 17cm인 원 모양의 접시를 굴렸더니 접시가 움직인 거리가 266.9cm였습니다. 접시를 몇 바퀴 굴렸는지 풀이 과정을 쓰고, 답을 구하시오.
    answer: 5바퀴

  - text: 반지름이 6.5cm인 원판을 굴렸더니 원판이 움직인 거리가 408.2cm였습니다. 원판을 몇 바퀴 굴렸는지 풀이 과정을 쓰고, 답을 구하시오.
    answer: 10바퀴

  - text: 반지름이 25cm인 굴렁쇠를 굴렸더니 굴렁쇠가 움직인 거리가 6m 28cm였습니다. 굴렁쇠를 몇 바퀴 굴렸는지 풀이 과정을 쓰고, 답을 구하시오.
    answer: 4바퀴

  - text: 반지름이 8cm인 원 3개를 끈으로 묶어 놓은 것입니다. 묶은 끈의 길이는 몇 cm인지 풀이 과정을 쓰고, 답을 구하시오. (단, 매듭은 생각하지 않습니다.)
    figure: p2.svg
    units: 5
    alt: 반지름 8cm인 원 3개를 나란히 놓고 끈으로 묶은 그림
    answer: 114.24cm

  - text: 반지름이 5cm인 원 4개를 끈으로 묶어 놓은 것입니다. 묶은 끈의 길이는 몇 cm인지 풀이 과정을 쓰고, 답을 구하시오. (단, 매듭은 생각하지 않습니다.)
    figure: p2_1.svg
    units: 6
    alt: 반지름 5cm인 원 4개를 두 줄로 놓고 끈으로 묶은 그림
    answer: 71.4cm

  - text: 지름이 21cm인 원 3개를 끈으로 묶어 놓은 것입니다. 묶은 끈의 길이는 몇 cm인지 풀이 과정을 쓰고, 답을 구하시오. (단, 매듭은 생각하지 않습니다.)
    figure: p2_2.svg
    units: 7
    alt: 지름 21cm인 원 3개를 삼각형으로 놓고 끈으로 묶은 그림
    answer: 128.94cm

  - text: 색칠한 부분의 둘레와 넓이를 각각 구하려고 합니다. 풀이 과정을 쓰고, 답을 구하시오.
    figure: p3.svg
    units: 6
    alt: 반지름 6cm인 원 안에 반지름 3cm인 반원 두 개로 나눈 그림
    answer: 둘레 37.68cm, 넓이 56.52cm²

  - text: 색칠한 부분의 둘레와 넓이를 각각 구하려고 합니다. 풀이 과정을 쓰고, 답을 구하시오.
    figure: p3_1.svg
    units: 6
    alt: 한 변이 18cm인 정사각형의 네 꼭짓점에서 그린 사분원 네 개를 색칠한 그림
    answer: 둘레 56.52cm, 넓이 254.34cm²

  - text: 색칠한 부분의 둘레와 넓이를 각각 구하려고 합니다. 풀이 과정을 쓰고, 답을 구하시오.
    figure: p3_2.svg
    units: 6
    alt: 한 변이 20cm인 정사각형 안에 반지름 10cm인 반원 두 개가 겹친 그림
    answer: 둘레 102.8cm, 넓이 200cm²

  - text: 작은 원의 원주는 25.12cm입니다. 큰 원의 넓이는 몇 cm²인지 풀이 과정을 쓰고, 답을 구하시오.
    figure: p4.svg
    units: 5
    alt: 중심이 같은 두 원. 두 원 사이의 폭이 2cm
    answer: 113.04cm²

  - text: 작은 원의 넓이는 78.5cm²입니다. 큰 원의 원주는 몇 cm인지 풀이 과정을 쓰고, 답을 구하시오.
    figure: p4_1.svg
    units: 5
    alt: 큰 원의 반지름을 지름으로 하는 작은 원이 큰 원 안에 붙어 있는 그림
    answer: 62.8cm

  - text: 큰 원의 넓이는 254.34cm²입니다. 작은 원 1개의 원주는 몇 cm인지 풀이 과정을 쓰고, 답을 구하시오.
    figure: p4_2.svg
    units: 6
    alt: 큰 원의 지름 위에 크기가 같은 작은 원 3개가 나란히 놓인 그림
    answer: 18.84cm
