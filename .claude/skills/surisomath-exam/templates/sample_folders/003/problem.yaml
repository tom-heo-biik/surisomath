# 견본 003. 지문, 선지, 정답, 풀이. 번호는 폴더 이름이 정하므로 no를 적지 않는다.
text: 한 변의 길이가 2인 정사각형의 대각선의 길이는?
choices:
  - $\sqrt{2}$
  - $\sqrt{3}$
  - $2\sqrt{2}$
  - $2\sqrt{3}$
  - $3\sqrt{2}$
answer: ③
solution: |
  대각선은 한 변의 길이가 2인
  직각이등변삼각형의 빗변이므로
  길이는 $\sqrt{2^2+2^2}=2\sqrt{2}$이다.
  따라서 대각선의 길이는 $2\sqrt{2}$이다.
